<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeowBlocker</title>
  <link href="https://api.fontshare.com/v2/css?f[]=panchang@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="off">
  <main class="app">
    <header class="top">
      <span class="brand">meow<span class="brand-accent">BLOCKER</span></span>
    </header>

    <section class="stage">
      <button id="toggle" class="power" aria-label="Toggle MeowBlocker">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v8"/>
          <path d="M18.36 7.05a9 9 0 1 1-12.72 0"/>
        </svg>
      </button>
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">Paused</span>
      </div>
      <div id="detail" class="detail">Blocking is turned off</div>
      <button id="whitelist" class="whitelist" type="button">Whitelist this site</button>
    </section>

    <footer class="foot">
      <a id="settingsLink" href="#">DNS-level blocking? Set it up in Chrome settings &rarr;</a>
      <a
        class="github-link"
        href="https://github.com/swevenxu"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open GitHub profile"
        title="GitHub profile"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 8.02c.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
        </svg>
      </a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
